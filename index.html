<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Tube Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Nixie+One&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Nixie One', monospace;
  }
  .digit, .separator {
    font-weight: 700; /* Bolds the thin wire stroke for better neon reflection */
  }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'VT323', monospace;
      overflow: hidden;
    }

    .nixie-container {
      background: #151313;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0, 0, 0, 0.8);
      border: 1px solid #2a2525;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }

    .digit, .separator {
      color: #ff5500;
      font-size: 2.5rem;
      letter-spacing: 1px;
      padding: 2px 6px;
      background: rgba(10, 5, 2, 0.6);
      border-radius: 6px;
      border: 1px solid rgba(255, 85, 0, 0.2);
      text-shadow: 
        0 0 2px #fff,
        0 0 8px #ff6600,
        0 0 15px #ff4500,
        0 0 25px #ff2200;
      box-shadow: inset 0 0 8px rgba(255, 68, 0, 0.3);
      white-space: nowrap;
    }

    .separator {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 2px 1px;
    }
  </style>
</head>
<body>

  <div class="nixie-container" id="clock">
    <!-- Clock digits stream here -->
  </div>

  <script>
    const months = [
      "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
      "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
    ];

    function updateClock() {
      const now = new Date();

      const day = String(now.getDate()).padStart(2, '0');
      const month = months[now.getMonth()];
      const year = now.getFullYear();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const fullString = `${day} ${month} ${year}  ${hours}:${minutes}:${seconds}`;

      const clockContainer = document.getElementById('clock');
      clockContainer.innerHTML = '';

      for (let char of fullString) {
        const span = document.createElement('span');
        if (char === ' ') {
          span.className = 'separator';
          span.innerHTML = '&nbsp;';
        } else if (char === ':') {
          span.className = 'separator';
          span.innerText = ':';
        } else {
          span.className = 'digit';
          span.innerText = char;
        }
        clockContainer.appendChild(span);
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
