<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Tube Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Nixie+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nixie One', cursive;
      overflow: hidden;
    }

    .nixie-container {
      background: #0f0e0e;
      padding: 20px 30px;
      border-radius: 12px;
      border: 1px solid #1f1c1c;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      
      /* Multi-layered shadow for ambient underglow */
      box-shadow: 
        0 15px 35px -5px rgba(255, 85, 0, 0.35), /* Tight bright underglow */
        0 30px 60px -10px rgba(255, 85, 0, 0.15), /* Wide diffuse underglow */
        0 0 20px rgba(0, 0, 0, 0.9),              /* Core dark drop shadow */
        inset 0 0 10px rgba(0, 0, 0, 0.8);        /* Inner container depth */
    }

    /* Glass Tube Frame Border */
    .tube {
      position: relative;
      background: linear-gradient(135deg, rgba(25, 25, 25, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px 25px 6px 6px; 
      padding: 8px 12px;
      box-shadow: 
        inset 3px 3px 6px rgba(255, 255, 255, 0.1), 
        inset -6px -6px 15px rgba(0, 0, 0, 0.9),    
        0 6px 10px rgba(0, 0, 0, 0.6);              
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 46px;
      height: 75px;
      overflow: hidden;
    }

    /* 2. Orange Mesh Grid Texture Overlay (Anode Mesh) */
    .tube::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 85, 0, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 85, 0, 0.1) 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 2; /* Sits between the ghost wires and active digit */
      pointer-events: none;
    }

    /* Curved glass reflection highlight */
    .tube::after {
      content: '';
      position: absolute;
      top: 2%;
      left: 10%;
      width: 15%;
      height: 90%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 20px;
      filter: blur(1px);
      pointer-events: none;
      z-index: 5;
    }

    .digit, .ghost, .separator {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
    }

    /* 1. Faint Flickering Effect */
    @keyframes neon-flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        text-shadow: 
          0 0 2px #fff,
          0 0 8px #ff6600,
          0 0 15px #ff4500,
          0 0 25px #ff2200;
        opacity: 1;
      }
      20%, 24%, 55% {
        text-shadow: 
          0 0 1px #fff,
          0 0 4px #ff6600,
          0 0 10px #ff4500;
        opacity: 0.85;
      }
    }

    /* Active Glowing Number */
    .digit {
      position: relative;
      color: #ff5500;
      z-index: 3;
      animation: neon-flicker 5s infinite alternate;
    }

    /* Unlit Background Cathode Wires */
    .ghost {
      position: absolute;
